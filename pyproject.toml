[project]
name = "trading-bot"
version = "2.0.0"
description = "Bot de trading spot (Bybit EU / Binance) con gestión de riesgo por ATR"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["trading_bot", "tests", "backtest"]
